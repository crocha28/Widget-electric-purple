<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loading preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    margin: 0;
    background: linear-gradient(135deg, #1c0053 0%, #4a0e7a 100%);
    color: #fffdfb;
    font-family: 'IQOS Sans', sans-serif;
    min-height: 100vh;
  }
  .widget-inner {
    width: 100%;
    box-sizing: border-box;
    padding: 64px;
  }
  @media (max-width: 1023px) { .widget-inner { padding: 80px 40px 48px; } }
  @media (max-width: 767px) { .widget-inner { padding: 60px 24px 40px; } }
  .widget-heading { font-size: 32px; font-weight: 700; line-height: 1.35; }
  .video-loading-placeholder {
    width: min(100%, calc(17.5vh * 16 / 9));
    aspect-ratio: 16 / 9;
    margin-left: auto;
    margin-right: auto;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(110deg,
      rgba(255,253,251,0.06) 0%,
      rgba(155,10,165,0.12) 40%,
      rgba(255,253,251,0.06) 60%,
      rgba(155,10,165,0.08) 100%);
    background-size: 200% 100%;
    animation: shimmer 2.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .video-loading-inner {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; height: 100%;
  }
  .video-loading-spinner { width: 40px; height: 40px; animation: spin 1s linear infinite; }
  .video-loading-spinner svg { width: 100%; height: 100%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .video-loading-text { font-size: 14px; color: rgba(255,253,251,0.6); letter-spacing: 0.28px; }
  .cta {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 32px; font-size: 16px; line-height: 1.5;
    border-radius: 64px; background: transparent; color: #fffdfb;
    box-shadow: inset 0 0 0 1px #fffdfb;
    cursor: pointer;
  }
  .info {
    position: fixed; top: 16px; right: 16px;
    background: rgba(0,0,0,0.6); padding: 12px 16px; border-radius: 8px;
    font-size: 12px; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="info">
    Viewport: <span id="vw"></span> × <span id="vh"></span><br>
    Placeholder height: <span id="ph"></span>px
  </div>
  <div class="widget-inner">
    <h2 class="widget-heading mb-8">Your Electric Dream awaits.</h2>
    <div class="video-loading-placeholder">
      <div class="video-loading-inner">
        <div class="video-loading-spinner">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="16" stroke="rgba(255,253,251,0.15)" stroke-width="3"/>
            <path d="M20 4a16 16 0 0 1 16 16" stroke="#fffdfb" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="video-loading-text">Generating your Electric Dream...</p>
      </div>
    </div>
    <div class="flex justify-center mt-6">
      <button class="cta">Cancel</button>
    </div>
  </div>
  <script>
    const update = () => {
      document.getElementById('vw').textContent = window.innerWidth;
      document.getElementById('vh').textContent = window.innerHeight;
      const el = document.querySelector('.video-loading-placeholder');
      document.getElementById('ph').textContent = Math.round(el.getBoundingClientRect().height);
    };
    update();
    window.addEventListener('resize', update);
  </script>
</body>
</html>
