<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electric Dreams | IQOS Electric Purple</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface-dark': '#1c0053',
            'text-light': '#fffdfb',
            'card-bg': 'rgba(255,253,251,0.1)',
            'card-border': 'rgba(255,253,251,0.1)',
          },
        },
      },
    };
  </script>
  <style>
    @font-face {
      font-family: 'IQOS Sans';
      src: url('public/fonts/iqos-sans-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IQOS Sans';
      src: url('public/fonts/iqos-sans-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'IQOS Sans', system-ui, sans-serif;
      color: #fffdfb;
      background-color: #1c0053;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
    }
    ::selection { background-color: #a082e6; color: white; }

    /* ─── Section wrapper ─── */
    .widget-inner {
      position: relative;
      z-index: 10;
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 24px;
    }

    /* ─── Heading ─── */
    .widget-heading {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      color: #fffdfb;
    }

    /* ─── Cards container ─── */
    .dream-cards {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    /* ─── Card (base = mobile) ─── */
    .dream-card {
      position: relative;
      background: rgba(255,253,251,0.1);
      border: 1px solid rgba(255,253,251,0.1);
      border-radius: 8px;
      overflow: hidden;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: 16px;
      gap: 16px;
    }

    @media (max-width: 1023px) {
      .dream-card { flex-grow: 0 !important; }
    }

    /* ─── Card image (mobile/tablet only) ─── */
    .card-image {
      width: 119px;
      height: 137px;
      flex: 0 0 119px;
      border-radius: 8px;
      overflow: hidden;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── Desktop absolute image ─── */
    .dream-image-desktop { display: none; }

    /* ─── Card text ─── */
    .card-text {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 0%;
      min-width: 0;
    }
    .card-icon { width: 12px; height: 12px; }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fffdfb;
      letter-spacing: 0.08px;
      line-height: 1;
    }
    .card-desc {
      font-size: 11px;
      color: rgba(255,253,251,0.8);
      line-height: 1.5;
      letter-spacing: 0.22px;
    }

    /* ─── TABLET (768px – 1023px) ─── */
    @media (min-width: 768px) and (max-width: 1023px) {
      .widget-inner { padding: 48px 40px; gap: 32px; }
      .widget-heading { font-size: 32px; }
      .dream-card { align-items: center; gap: 24px; }
      .card-image {
        width: auto;
        height: 160px;
        flex: 1 1 0%;
        min-width: 0;
      }
    }

    /* ─── DESKTOP (1024px+) ─── */
    @media (min-width: 1024px) {
      .widget-inner { padding: 64px; gap: 40px; }
      .widget-heading { font-size: 40px; }
      .dream-cards { flex-direction: row; }
      .dream-card {
        flex-direction: column;
        height: 430px;
        justify-content: space-between;
        padding: 24px;
        gap: 0;
        flex-shrink: 0;
        flex-basis: 0%;
        min-width: 0;
        transition: flex-grow 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-image { display: none; }
      .dream-image-desktop {
        display: block;
        position: absolute;
        z-index: 0;
        border-radius: 8px;
        overflow: hidden;
        transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                    top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                    width 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                    height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .dream-cards.animating .dream-card,
      .dream-cards.animating .dream-card .dream-image-desktop { transition: none !important; }
      .card-text {
        position: relative;
        z-index: 10;
        flex: none;
        width: 100%;
      }
      .card-icon { width: 16px; height: 16px; }
      .card-title { font-size: 21px; letter-spacing: 0.105px; }
      .card-desc { font-size: 12px; letter-spacing: 0.24px; }

      .video-phase-wrap { flex-direction: row; }
      .video-sidebar { width: 370px; flex-shrink: 0; }
      .video-sidebar-inner { padding: 40px; }
      .video-title { font-size: 30px; }
    }
  </style>
</head>
<body>

  <section id="dream-selector" class="relative w-full min-h-screen overflow-hidden">
    <div class="absolute inset-0 w-full h-full">
      <img src="public/images/mesh-gradient.svg" alt="" class="absolute inset-0 w-full h-full object-cover pointer-events-none" />
    </div>

    <div class="widget-inner">
      <div class="w-full">
        <h2 id="dream-heading" class="widget-heading">Choose the dream that calls to you.</h2>
      </div>

      <div id="cards-phase" class="w-full">
        <div id="dream-cards" class="dream-cards">

          <!-- Card 1: Archipelago -->
          <button data-dream="archipelago" data-cat="Nature" class="dream-card" style="flex-grow:424">
            <div class="dream-image-desktop" style="left:23px;top:91px;width:376px;height:260px">
              <img src="public/images/dream-archipelago.png" alt="" class="w-full h-full object-cover" />
            </div>
            <div class="card-image">
              <img src="public/images/dream-archipelago.png" alt="" />
            </div>
            <div class="card-text">
              <div class="flex flex-col gap-2">
                <svg class="card-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7.6 14.1C6.43 14.1 5.3 13.67 4.44 12.88C3.57 12.09 3.04 11 2.94 9.83C2.84 8.67 3.18 7.51 3.89 6.58C4.61 5.65 5.65 5.03 6.8 4.83C10.6 4.1 11.6 3.75 12.93 2.1C13.6 3.43 14.27 4.89 14.27 7.43C14.27 11.1 11.08 14.1 7.6 14.1Z" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M1.73 12.1C1.73 10.1 2.97 8.53 5.12 8.1C6.73 7.78 8.4 6.77 9.07 6.1" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3 class="card-title">Archipelago Sunset Cruise</h3>
              </div>
              <p class="card-desc">Sail into the golden hour. Open water, island silence, and a sky that bleeds Electric Purple.</p>
            </div>
          </button>

          <!-- Card 2: Gröna Lund -->
          <button data-dream="grona-lund" data-cat="Music" class="dream-card" style="flex-grow:424">
            <div class="dream-image-desktop" style="left:23px;top:91px;width:376px;height:260px">
              <img src="public/images/dream-grona-lund.png" alt="" class="w-full h-full object-cover" />
            </div>
            <div class="card-image">
              <img src="public/images/dream-grona-lund.png" alt="" />
            </div>
            <div class="card-text">
              <div class="flex flex-col gap-2">
                <svg class="card-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6.6 13.6V4.93L14.6 3.6V12.27" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="4.6" cy="13.6" r="2" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12.6" cy="12.27" r="2" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3 class="card-title">Gröna Lund Live Concert</h3>
              </div>
              <p class="card-desc">Front row. Full volume. A night where the bass hits as hard as the view.</p>
            </div>
          </button>

          <!-- Card 3: Floating Sauna -->
          <button data-dream="floating-sauna" data-cat="Wellness" class="dream-card" style="flex-grow:424">
            <div class="dream-image-desktop" style="left:23px;top:91px;width:376px;height:260px">
              <img src="public/images/dream-floating-sauna.png" alt="" class="w-full h-full object-cover" />
            </div>
            <div class="card-image">
              <img src="public/images/dream-floating-sauna.png" alt="" />
            </div>
            <div class="card-text">
              <div class="flex flex-col gap-2">
                <svg class="card-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1.0 4.6C1.4 4.93 1.8 5.27 2.67 5.27C4.33 5.27 4.33 3.93 6.0 3.93C7.73 3.93 7.6 5.27 9.33 5.27C11.0 5.27 11.0 3.93 12.67 3.93C13.53 3.93 13.93 4.27 14.33 4.6" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M1.0 8.0C1.4 8.33 1.8 8.67 2.67 8.67C4.33 8.67 4.33 7.33 6.0 7.33C7.73 7.33 7.6 8.67 9.33 8.67C11.0 8.67 11.0 7.33 12.67 7.33C13.53 7.33 13.93 7.67 14.33 8.0" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M1.0 11.4C1.4 11.73 1.8 12.07 2.67 12.07C4.33 12.07 4.33 10.73 6.0 10.73C7.73 10.73 7.6 12.07 9.33 12.07C11.0 12.07 11.0 10.73 12.67 10.73C13.53 10.73 13.93 11.07 14.33 11.4" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3 class="card-title">Floating Sauna Experience</h3>
              </div>
              <p class="card-desc">Heat, cold water, and nothing else. Stillness so deep it feels Electric.</p>
            </div>
          </button>

        </div>

        <div id="video-placeholder" class="w-full bg-white/10 rounded-[16px] overflow-hidden mt-10" style="height:0;opacity:0"></div>
        <div class="flex justify-center mt-6">
          <button id="cancel-btn" class="border border-card-border rounded-full px-6 py-2 text-base text-text-light bg-white/5 hover:bg-white/10 transition-colors cursor-pointer" style="opacity:0">Cancel</button>
        </div>
      </div>

      <div id="video-phase" class="video-phase-wrap flex flex-col gap-6 w-full" style="display:none;opacity:0">
        <div class="flex-1 min-h-0">
          <div class="w-full aspect-video bg-white/10 rounded-[12px] flex items-center justify-center">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" class="opacity-40"><path d="M6.5 4.8v14.4L19 12 6.5 4.8z" stroke="#fffdfb" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="video-sidebar w-full shrink-0">
          <div class="video-sidebar-inner bg-white/5 border border-card-border rounded-[12px] p-6 flex flex-col gap-4">
            <div class="flex flex-col gap-2">
              <h3 id="video-title" class="video-title text-2xl font-bold text-text-light leading-[1.4]"></h3>
              <p class="text-xs text-text-light/40 tracking-wide">Duration: 8s &middot; Format: 9:16 &middot; Quality: 750p</p>
            </div>
            <div class="h-px bg-white/10"></div>
            <div class="flex flex-col gap-6">
              <button class="inline-flex items-center justify-center w-full px-7 py-3.5 text-sm rounded-full border-2 border-text-light text-text-light bg-transparent hover:bg-white/10 transition-all cursor-pointer">Download my video</button>
              <button class="inline-flex items-center justify-center w-full px-7 py-3.5 text-sm rounded-full bg-text-light text-surface-dark hover:bg-text-light/90 transition-all cursor-pointer">Join the competition</button>
            </div>
            <div class="h-px bg-white/10"></div>
            <button id="try-another" class="text-sm text-text-light/50 hover:text-text-light transition-colors text-left cursor-pointer">Try another dream</button>
          </div>
        </div>
      </div>
    </div>
  </section>

<script>
const isDesktop = () => window.innerWidth >= 1024;

const dreams = {
  archipelago: { title: 'Archipelago Sunset Cruise' },
  'grona-lund': { title: 'Gröna Lund Live Concert' },
  'floating-sauna': { title: 'Floating Sauna Experience' },
};
const cards = Array.from(document.querySelectorAll('.dream-card'));
const desktopImages = cards.map(c => c.querySelector('.dream-image-desktop'));
const dreamCardsContainer = document.getElementById('dream-cards');
const placeholder = document.getElementById('video-placeholder');
const cancelBtn = document.getElementById('cancel-btn');
const cardsPhase = document.getElementById('cards-phase');
const videoPhase = document.getElementById('video-phase');
const videoTitle = document.getElementById('video-title');
const heading = document.getElementById('dream-heading');
const tryAnother = document.getElementById('try-another');
let currentTl = null;
let phase = 'select';

cards.forEach((card, i) => {
  card.addEventListener('mouseenter', () => {
    if (phase !== 'select' || !isDesktop()) return;
    cards.forEach((c, j) => {
      if (j === i) { c.style.flexGrow = 524; desktopImages[j].style.cssText = 'left:0;top:0;width:100%;height:100%'; }
      else { c.style.flexGrow = 370; desktopImages[j].style.cssText = 'left:23px;top:91px;width:322px;height:242px'; }
    });
  });
});
dreamCardsContainer.addEventListener('mouseleave', () => {
  if (phase !== 'select' || !isDesktop()) return;
  cards.forEach((c, j) => { c.style.flexGrow = 424; desktopImages[j].style.cssText = 'left:23px;top:91px;width:376px;height:260px'; });
});

cards.forEach((card, ci) => {
  card.addEventListener('click', () => {
    if (phase !== 'select') return;
    const dreamId = card.dataset.dream;
    phase = 'loading';
    heading.textContent = 'Your Electric Dream awaits.';

    if (isDesktop()) {
      dreamCardsContainer.classList.add('animating');
      const imgPos = desktopImages.map(img => ({ left: img.offsetLeft, top: img.offsetTop, width: img.offsetWidth, height: img.offsetHeight }));
      const cardFG = cards.map(c => parseFloat(getComputedStyle(c).flexGrow) || 424);

      desktopImages.forEach((img, i) => gsap.set(img, { left: imgPos[i].left, top: imgPos[i].top, width: imgPos[i].width, height: imgPos[i].height, opacity: 1 }));
      cards.forEach((c, i) => gsap.set(c, { pointerEvents: 'none', cursor: 'default', height: 430, flexGrow: cardFG[i] }));

      cards.forEach((c, i) => gsap.set(c, { height: 'auto', flexGrow: i === ci ? 524 : 370, justifyContent: 'flex-start', gap: 16 }));
      const uniH = Math.max(...cards.map(c => c.offsetHeight));
      cards.forEach((c, i) => gsap.set(c, { height: 430, flexGrow: cardFG[i], justifyContent: 'space-between', gap: 0 }));

      gsap.set(placeholder, { height: 0, opacity: 0 });
      gsap.set(cancelBtn, { opacity: 0, y: 0 });

      const tl = gsap.timeline();
      currentTl = tl;

      cards.forEach((c, i) => {
        tl.to(c, { height: uniH, flexGrow: i === ci ? 524 : 370, justifyContent: 'flex-start', gap: 16, duration: 0.85, ease: 'power3.inOut' }, 0);
        if (i === ci) {
          tl.to(desktopImages[i], { left: 0, top: 0, width: '100%', height: '100%', borderRadius: 8, duration: 0.85, ease: 'power3.inOut' }, 0);
        } else {
          tl.to(desktopImages[i], { width: 160, height: 110, left: 16, top: 50, duration: 0.85, ease: 'power3.inOut' }, 0);
          tl.to(desktopImages[i], { opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.15);
        }
      });
      tl.fromTo(placeholder, { height: 0, opacity: 0 }, { height: 516, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0.25);
      tl.fromTo(cancelBtn, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.6);
    } else {
      gsap.set(cancelBtn, { opacity: 0, y: 0 });
      gsap.set(placeholder, { height: 0, opacity: 0 });
      const tl = gsap.timeline();
      currentTl = tl;
      tl.fromTo(placeholder, { height: 0, opacity: 0 }, { height: 300, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0);
      tl.fromTo(cancelBtn, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.4);
    }

    setTimeout(() => {
      if (phase !== 'loading') return;
      phase = 'video';
      videoTitle.textContent = dreams[dreamId].title;
      cardsPhase.style.display = 'none';
      videoPhase.style.display = 'flex';
      gsap.fromTo(videoPhase, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' });
    }, 4000);
  });
});

cancelBtn.addEventListener('click', () => {
  if (currentTl) currentTl.kill();
  if (isDesktop()) {
    const rev = gsap.timeline({ onComplete: resetToSelect });
    rev.to([cancelBtn, placeholder], { opacity: 0, y: 12, duration: 0.35, ease: 'power2.in' });
    cards.forEach((c, i) => {
      rev.to(c, { height: 430, flexGrow: 424, justifyContent: 'space-between', gap: 0, duration: 0.75, ease: 'power3.inOut' }, 0.1);
      rev.to(desktopImages[i], { left: 23, top: 91, width: 376, height: 260, borderRadius: 8, opacity: 1, duration: 0.75, ease: 'power3.inOut' }, 0.1);
    });
    rev.set(cards, { pointerEvents: 'auto', cursor: 'pointer' });
    rev.set(cards, { clearProps: 'height,flexGrow,justifyContent,gap' });
    rev.set(desktopImages, { clearProps: 'left,top,width,height,borderRadius,opacity' });
  } else {
    const rev = gsap.timeline({ onComplete: resetToSelect });
    rev.to([cancelBtn, placeholder], { opacity: 0, y: 12, duration: 0.35, ease: 'power2.in' });
  }
});

tryAnother.addEventListener('click', () => {
  videoPhase.style.display = 'none';
  videoPhase.style.opacity = 0;
  cardsPhase.style.display = 'block';
  resetToSelect();
  if (isDesktop()) {
    cards.forEach((c, i) => {
      gsap.set(c, { clearProps: 'height,flexGrow,justifyContent,gap,pointerEvents,cursor' });
      gsap.set(desktopImages[i], { clearProps: 'left,top,width,height,borderRadius,opacity' });
      c.style.flexGrow = 424;
      desktopImages[i].style.cssText = 'left:23px;top:91px;width:376px;height:260px';
    });
  }
});

function resetToSelect() {
  phase = 'select';
  heading.textContent = 'Choose the dream that calls to you.';
  dreamCardsContainer.classList.remove('animating');
  if (isDesktop()) {
    cards.forEach((c, i) => {
      c.style.flexGrow = 424;
      desktopImages[i].style.cssText = 'left:23px;top:91px;width:376px;height:260px';
    });
  }
}
</script>
</body>
</html>
